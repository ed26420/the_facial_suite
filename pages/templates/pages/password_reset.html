{% extends 'pages/base.html' %}
{% load static %} 

{% block content %}
<main>
    <section class="pf-registration-page-area pt-120 pb-120">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-xl-6 col-lg-8">
                    <div class="pf-checkout-form">
                        <h3 class="pf-checkout-title mb-20">Reset Password</h3>
                        <p class="mb-30" style="color: #666;">Forgotten your password? Enter your email address below, and we’ll email you instructions on how to set a new one.</p>

                        <form method="POST">
                            {% csrf_token %}
                            <div class="row">
                                <div class="col-lg-12">
                                    <div class="form-group mb-20">
                                        <label>Email Address</label>
                                        {{ form.email }}
                                    </div>
                                </div>
                                <div class="checkout-btn col-lg-12 mt-20">
                                    <button type="submit" class="theme-btn style-one w-100" style="border: none; cursor: pointer;">
                                        <span>Send Reset Link</span>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
{% endblock content %}
