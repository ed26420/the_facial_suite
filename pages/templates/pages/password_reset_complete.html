{% extends 'pages/base.html' %}
{% load static %} 

{% block content %}
<main>
    <section class="pf-registration-page-area pt-120 pb-120">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-xl-6 col-lg-8">
                    <div class="pf-checkout-form text-center wow pfFadeInUp" data-wow-duration=".6s" data-wow-delay=".2s">
                        <h3 class="pf-checkout-title mb-20">Password Reset Complete</h3>
                        <p class="mb-30" style="color: #666;">
                            Your password has been set successfully. You can now log in with your new password.
                        </p>
                        <a href="{% url 'login' %}" class="theme-btn style-one w-100" style="text-decoration: none; display: inline-block; line-height: 50px;">
                            Login Now
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
{% endblock content %}
